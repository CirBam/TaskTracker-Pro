<!doctype HTML>
<html>
<head>
  <title>TaskTracker Pro</title>
</head>
<body>
  <header>
    <h1>TaskTracker Pro</h1>
  </header>
  <nav>
  </nav>
  <h2>Welcome User</h2>
  <div>
    <h3>Upcoming Deadlines</h3>
    <table>
      <tr>
	<td>
	  <p>Tasks:</p>
	  <div id="tasklist"></div>
	</td>
	<td>
	  <p>Due Date:</p>
	  <div id="datelist"></div>
	</td>
      </tr>
    </table>
  </div>
  <div id="summary">
    <h3>Task Summary</h3>
    <p id="active">Active Tasks: N/A</p>
    <p id="complete">Completed Tasks: N/A</p>
    <p id="urgent">Urgent Tasks: N/A</p>
  </div>
</body>
</html>
