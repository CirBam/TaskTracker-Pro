<!doctype HTML>
<html>

    <title>TaskTracker Pro</title>
    <link rel="stylesheet" href="loginstyle.css">
  </head>
  <body>
    <h2>User Registration</h2>
    <div>
      <form>

        <input type="text" id="username" name="username"><br>

	<a href="login.html">
          <button type="button">Back to login</button>
	</a>
      </form>
    </div>
  </body>
</html>
