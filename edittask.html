<!doctype HTML>
<html>
<head>
  <title>TaskTracker Pro</title>
</head>
<body>
  <header>
  </header>
  <nav>
  </nav>
  <h2>Create/Edit Task</h2>
  <form>
    <p>Title</p>
    <input type="text" id="title"><br>
    <p>Description</p>
    <input type="text" id="desc"><br>
    <p>Due Date</p>
    <input type="date" id="date"><br>
    <p>Category</p>
    <select id="category">
      <option value="Work">Work</option>
      <option value="School">Schoolwork</option>
      <option value="Chore">Chores</option>
      <option value="Other">Miscellaneous</option>
    </select>
    <p>Priority</p>
    <select id="priority">
      <option value="Low">Low</option>
      <option value="Mid">Normal</option>
      <option value="High">High</option>
      <option value="Max">Urgent</option>
    </select>
  </form>
</body>
</html>
