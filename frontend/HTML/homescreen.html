<!doctype HTML>
<html>
<head>
  <title>TaskTracker Pro</title>
  <link rel="stylesheet" href="../CSS/header.css">
  <link rel="stylesheet" href="../CSS/dash.css">
	<script src="../JavaScript/siteFunctions.js"></script>
</head>
<body>
  <header class="navi">
    <h1>TaskTracker Pro</h1>
    <nav>
      <ul>
        <li>
          <a href="homescreen.html">Dashboard</a>
        </li>
        <li>
          <a href="tasklist.html">Tasks</a>
        </li>
        <li>
          <a href="edittask.html">Create Task</a>
        </li>
        <li>
          <a onclick="logout()" style="cursor: pointer;">Logout</a>
        </li>
      </ul>
    </nav>
  </header>
  <h2 id="greeting">Welcome, User</h2>
  <div>
    <h3>Upcoming Deadlines</h3>
    <table>
      <tr>
	<td>
	  <p>Tasks:</p>
	</td>
	<td>
	  <p>Due Date:</p>
	</td>
      </tr>
      <tr>
        <td>
	  <div class="data">
	    <ul id="tasklist">
	    </ul>
	  </div>
        </td>
        <td>
	  <div class="data">
	    <ul id="datelist">
	    </ul>
	  </div>
        </td>
      </tr>
    </table>
  </div>
  <div id="summary">
    <h3>Task Summary</h3>
    <p id="active">Active Tasks: N/A</p>
    <p id="complete">Completed Tasks: N/A</p>
    <p id="urgent">Urgent Tasks: N/A</p>
  </div>
  <script>loadDashboard();</script>
</body>
</html>
