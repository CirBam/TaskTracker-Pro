<!doctype HTML>
<html>
<head>
  <title>TaskTracker Pro</title>
  <link rel="stylesheet" href="../CSS/header.css">
  <link rel="stylesheet" href="../CSS/taskview.css">
  <script src="../JavaScript/taskprinter.js"></script>
	<script src="../JavaScript/siteFunctions.js"></script>
  <script src="../JavaScript/tasklistFunction.js"></script>
</head>
<body>
  <header class="navi">
    <h1>TaskTracker Pro</h1>
    <nav>
      <ul>
        <li>
          <a href="homescreen.html">Dashboard</a>
        </li>
        <li>
          <a href="tasklist.html">Tasks</a>
        </li>
        <li>
          <a href="edittask.html">Create Task</a>
        </li>
        <li>
          <a onclick="logout() style="cursor:pointer;">Logout</a>
        </li>
      </ul>
    </nav>
  </header>
  <h2>Tasks</h2>
  <table id="tablefilters">
    <tr>
      <td>
        <p>Filter:</p>
        <select class="filter">
          <option>All</option>
          <option>Work</option>
          <option>School</option>
          <option>Chores</option>
          <option>Miscellaneous</option>
        </select>
      </td>
      <td>
        <p>Sort by:</p>
        <select class="filter">
          <option>Due Date</option>
          <option>Priority</option>
          <option>Title</option>
        </select>
      </td>
    </tr>
  </table>
  <table id="tasktable">
    <tr>
      <td>Title</td>
      <td>Due Date</td>
      <td>Priority</td>
      <td>Category</td>
      <td>Status</td>
    </tr>
  </table>
  <table id="optiontable">
    <tr>
      <td>
	<button onclick="openView(0)">View</button>
      </td>
      <td>
	<button onclick="openView(1)">Edit</button>
      </td>
      <td>
	<button onclick="openView(2)">Delete</button>
      </td>
    </tr>
    <tr>
      <td colspan="3">
	<a href="edittask.html">
	  <button>Create New Task</button>
	</a>
      </td>
    </tr>
  </table>
	<script>
		var selectedTask = null;

		function openView(mode) {
			switch (mode) {
				case 0://view
					let targetUrl = "viewtask.html?taskid=" + selectedTask;
					window.location.href(targetUrl);
					break;
				case 1://edit
					let targetUrl = "edittask.html?taskid=" + selectedTask;
					window.location.href(targetUrl);
					break;
				case 2://delete
					var check = confirm("Are you sure you want to delete this task?");
					if (check) {
						//enter delete command here.
					}
					break;
				default:
					alert("Something went wrong. Please try again.");
		}
	</script>
</body>
</html>
