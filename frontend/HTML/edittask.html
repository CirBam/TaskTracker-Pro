<!doctype HTML>
<html>
<head>
  <title>TaskTracker Pro</title>
  <link rel="stylesheet" href="../CSS/header.css">
  <link rel="stylesheet" href="../CSS/loginstyle.css">
</head>
<body>
  <header class="navi">
    <h1>TaskTracker Pro</h1>
    <nav>
      <ul>
        <li>
          <a href="homescreen.html">Dashboard</a>
        </li>
        <li>
          <a href="tasklist.html">Tasks</a>
        </li>
        <li>
          <a href="edittask.html">Create Task</a>
        </li>
        <li>
          <a onclick="logout()">Logout</a>
        </li>
      </ul>
    </nav>
  </header>
  <h2>Create/Edit Task</h2>
  <div>
  <form>
    <p>Title</p>
    <input type="text" id="title"><br>
    <p>Description</p>
    <input type="text" id="desc"><br>
    <p>Due Date</p>
    <input type="date" id="date"><br>
    <p>Category</p>
    <select id="category">
      <option value="Work">Work</option>
      <option value="School">Schoolwork</option>
      <option value="Chore">Chores</option>
      <option value="Other">Miscellaneous</option>
    </select>
    <p>Priority</p>
    <select id="priority">
      <option value="Low">Low</option>
      <option value="Mid">Normal</option>
      <option value="High">High</option>
      <option value="Max">Urgent</option>
    </select>
    <button type="submit">Save</button>
    <button>Cancel</button>
  </form></div>
</body>
</html>
