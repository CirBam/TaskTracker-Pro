  <h2>View Task</h2>
  <div>
    <p>Title</p>
    <p class="data" id="title">Error</p>
    <p>Description</p>
    <p class="data" id="desc">Blank</p>
    <p>Due Date</p>
    <p class="data" id="date">1/1/1970</p>
    <table>
      <tr>
        <td><p>Category</p></td>
        <td><p>Priority</p></td>
        <td><p>Status</p></td>
      </tr>
      <tr>
        <td><p class="data" id="category">Other</p></td>
        <td><p class="data" id="priority">Low</p></td>
        <td><p class="data" id="complete">Not Completed</p><td>
      </tr>
      <tr>
        <td>
          <button onclick="finished()">Mark Complete</button>
        </td>
        <td>
	  <button onclick="edit()">Edit</button>
	</td>
        <td>
	  <button onclick="deleteTask()">Delete</button>
	</td>
      </tr>
    </table>
	  <script>
		  const currentUserId = localStorage.getItem("user_id");
		  if (!currentUserId) {
			  alert("You must be logged in to view tasks.");
			  window.location.href = "login.html";
		  }
		  
		  let params = new URLSearchParams(window.location.search);
		  const task_id = params.get("taskid");
		  
		  if (!task_id) {
		  }
		  else {
			  //put data request here
			  let data = null; //save requested data to this variable.
			  if (!data) {
				  alert("Task does not exist.");
				  window.location.href = "tasklist.html";
			  }
			  else if (data.userid != currentUserId) {
				  alert("You do not have permission to access this task.");
				  window.location.href = "tasklist.html";
			  }
			  else {
				  document.getElementById("title").innerHTML = data.title;
				  document.getElementById("desc").innerHTML = data.desc;
				  document.getElementById("date").innerHTML = data.date;
				  document.getElementById("priority").innerHTML = data.prioity;
				  document.getElementById("complete").innerHTML = data.complete;
			  }
		  }

		  function finished() {
			  //put request for marking task complete here.
		  }
	  </script>
  </div>
</body>
</html>
